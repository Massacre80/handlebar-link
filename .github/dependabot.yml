version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for the toolchain that must move together.
      kotlin-and-agp:
        patterns: ["org.jetbrains.kotlin*", "com.android.tools.build*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
