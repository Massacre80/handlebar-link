# Every push and pull request: secret scan, then the same `./gradlew check` that runs locally, plus a
# release build (R8). Actions are pinned to commit SHAs; Dependabot proposes updates.
name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the secret scan

      - name: Scan for secrets (gitleaks v8.30.1, checksum-pinned)
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # The default "enhanced" cache is only a free preview for private repositories.
          cache-provider: basic

      - name: Check (format, detekt, lint, tests, coverage, module boundaries)
        run: ./gradlew check --console=plain

      - name: Release build (R8)
        run: ./gradlew assembleRelease --console=plain

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          # Reports, plus the screenshot suites' rendered and diff images (the HTML report links none).
          path: |
            **/build/reports/
            **/build/intermediates/debug/test*ScreenshotTest*TestSuite/results/
          retention-days: 7
