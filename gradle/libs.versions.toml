# Managed by tooling, never typed by hand (docs/LESSONS.md 17): add a library with
# `./gradlew addLibrary --coordinates=group:artifact`, update with `./gradlew versionCatalogUpdate`.
# Entries are sorted by the formatter, so every comment describes only the entry right below it.
[versions]
androidGradlePlugin = "9.5.1"
androidxActivity = "1.13.0"
androidxComposeBom = "2026.09.00"
androidxCore = "1.19.1"
androidxCoreTelecom = "1.1.0"
androidxDatastore = "1.3.0"
androidxHiltLifecycleViewmodelCompose = "1.4.0"
androidxLifecycle = "2.11.0"
androidxNavigation3 = "1.2.1"
androidxTestRunner = "1.7.0"
assertk = "0.28.1"
# Supported Android: minSdk 31 (Android 12) up to compile/target 37 (docs/PLAN.md, "Fixed decisions").
compileSdk = "37"
coroutines = "1.11.0"
detekt = "1.23.8"
# detekt 1.23.x runs on the Kotlin compiler it was built with; its own classpath is pinned to this.
detektKotlin = "2.0.21"
foojay = "1.0.0"
# Hilt ≥ 2.59 is required for AGP 9 (the Android docs still show 2.57.1, which does not support AGP 9).
hilt = "2.60.1"
# Coverage tool, as Google's testing-setup skill prescribes.
jacoco = "0.8.16"
jdk = "21"
junit = "4.13.2"
# Bytecode level for every module; the toolchain that compiles it is JDK 21.
jvmTarget = "17"
kotlin = "2.4.21"
# KSP 2.3.x supports AGP 9 built-in Kotlin (fixes in 2.3.5/2.3.6/2.3.10); 2.3.13 is marked "Defect in release".
ksp = "2.3.14"
ktlint = "1.8.0"
minSdk = "31"
robolectric = "4.18"
# Compose Preview Screenshot Testing has no stable release yet (added with --allow-prerelease);
# the engine (screenshot-validation-junit-engine) is released with this API under the same version.
screenshotValidationApi = "0.0.1-alpha17"
serialization = "1.13.0"
spotless = "8.11.0"
targetSdk = "37"
turbine = "1.2.1"
vcuGradlePlugin = "1.1.2"

[libraries]
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "androidGradlePlugin" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-core-telecom = { module = "androidx.core:core-telecom", version.ref = "androidxCoreTelecom" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidxDatastore" }
androidx-hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "androidxHiltLifecycleViewmodelCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidxLifecycle" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "androidxNavigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "androidxNavigation3" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
assertk = { module = "com.willowtreeapps.assertk:assertk", version.ref = "assertk" }
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
detekt-gradlePlugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-gradlePlugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
screenshot-validation-api = { module = "com.android.tools.screenshot:screenshot-validation-api", version.ref = "screenshotValidationApi" }
screenshot-validation-junit-engine = { module = "com.android.tools.screenshot:screenshot-validation-junit-engine", version.ref = "screenshotValidationApi" }
serialization-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
spotless-gradlePlugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
vcu-gradlePlugin = { module = "nl.littlerobots.vcu:plugin", version.ref = "vcuGradlePlugin" }
