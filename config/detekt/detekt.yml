# Additions to detekt's default rules (buildUponDefaultConfig = true). Keep this file short:
# every entry needs a reason. Rule numbers refer to docs/research/01-architecture.md §5.
# Defaults checked against detekt-core 1.23.8's default-detekt-config.yml.

comments:
  # Rule 16: public API is documented. Off by default in detekt.
  UndocumentedPublicClass:
    active: true
  UndocumentedPublicFunction:
    active: true
  UndocumentedPublicProperty:
    active: true

coroutines:
  # Rule 6: no GlobalScope. Off by default in detekt; works without type resolution.
  GlobalCoroutineUsage:
    active: true
  # InjectDispatcher and SuspendFunSwallowedCancellation need type resolution, which `check` does not
  # run (docs/LESSONS.md 1): checkForbiddenCode enforces dispatchers, scopes and runCatching instead.

naming:
  FunctionNaming:
    # Composable functions are PascalCase by convention.
    ignoreAnnotated: ['Composable']

complexity:
  TooManyFunctions:
    # Methods an interface or a framework callback requires (spi implementations, BluetoothGattCallback)
    # are not a design choice; count only the class's own functions.
    ignoreOverridden: true
  CyclomaticComplexMethod:
    # A `when` whose branches are one call each (an event dispatch) is not complex logic.
    ignoreSimpleWhenEntries: true
  LongParameterList:
    # Composables take many optional parameters by design.
    ignoreAnnotated: ['Composable']
    ignoreDefaultParameters: true

style:
  # Rule 14: protocol bytes live only in *:protocol modules, where every number comes from the spec.
  MagicNumber:
    excludes: ['**/test/**', '**/testFixtures/**', '**/*.kts', '**/protocol/src/main/**']
  UnusedPrivateMember:
    # @Preview functions are used by tooling, not code.
    ignoreAnnotated: ['Preview']
  # Rules 8 and 9: time only through an injected clock; output only through our Logger.
  # Off by default in detekt.
  ForbiddenMethodCall:
    active: true
    methods:
      - reason: 'Use the Logger.'
        value: 'kotlin.io.print'
      - reason: 'Use the Logger.'
        value: 'kotlin.io.println'
      - reason: 'Read time from the injected Clock.'
        value: 'java.lang.System.currentTimeMillis'
      - reason: 'Read time from the injected Clock.'
        value: 'java.time.Instant.now'
      - reason: 'Read time from the injected Clock.'
        value: 'java.time.LocalDateTime.now'
      - reason: 'Read time from the injected Clock.'
        value: 'java.time.ZonedDateTime.now'
      - reason: 'Read time from the injected Clock.'
        value: 'java.time.OffsetDateTime.now'
  ForbiddenImport:
    active: true
    imports:
      - value: 'android.util.Log'
        reason: 'Use the Logger.'
